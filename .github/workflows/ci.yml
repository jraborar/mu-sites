name: CI

# This repo had no workflows at all — nothing compiled anything on a PR, so a
# broken build reached main and was noticed at deploy time or later.
#
# Runs on main too, not just PRs: a merge commit is a tree no PR run ever
# tested, and a semantic conflict between two independently-green PRs shows up
# nowhere else.
#
# No lint step: this repo has TypeScript but no eslint installed. Adding one is
# a separate change, because it will surface a pre-existing backlog and a gate
# that is red on day one gets ignored.

on:
  pull_request:
  push:
    branches: [main]

# A force-push or a quick second commit supersedes the run in flight. Without
# this they both finish, and the slower one can report last.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      # 22 to match the sister apps' node:22-bookworm-slim. Unlike them this
      # repo has no Dockerfile, so there is no pinned production major to match
      # exactly — 22 keeps it consistent with the rest of the family rather
      # than tracking whatever the runner defaults to.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `ci` not `install`: installs exactly the lockfile, and fails if
      # package.json and package-lock.json have drifted — itself a bug worth
      # failing on.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Deliberately NO env vars. Verified: the build succeeds with .env.local
      # moved aside, which is what CI actually has. If this step ever starts
      # needing a secret, that is the regression.
      - name: Build
        run: npm run build
